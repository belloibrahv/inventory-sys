# Runs on every push and pull request. Railway deploys main as soon as it is
# pushed, so this is the only thing standing between a broken change and the
# shops: a red check here means stop and fix before the next push.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres with demo data, the same kind of database the shops
    # run on. Never a real shop's.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-throwaway@localhost:5432/shop
      NEXTAUTH_SECRET: ci-throwaway-signing-key-used-only-by-github-checks
      NEXTAUTH_URL: http://localhost:3000
      SEED_DEMO_USERS: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: |
          node scripts/use-postgres-schema.mjs
          npx prisma generate

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx next build

      - name: Demo database
        run: |
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts

      - name: Money, stock and shop checks
        run: npm run check:all
